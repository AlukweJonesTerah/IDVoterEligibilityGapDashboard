services:
  postgres:
    image: postgres:16-alpine
    container_name: icta-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icta_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-icta_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND_HOST:-0.0.0.0}:${POSTGRES_HOST_PORT:-15424}:5432"
    volumes:
      - icta_dashboard_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_DASHBOARD_REFRESH_MS: ${NEXT_PUBLIC_DASHBOARD_REFRESH_MS:-600000}
    container_name: icta-dashboard-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ICTA Dashboard}
      DATABASE_URL: ${DATABASE_URL:?missing DATABASE_URL}
      ICTA_API_CACHE_TTL_MS: ${ICTA_API_CACHE_TTL_MS:-600000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3094}:3000"
    networks:
      - default
      - caddy_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  icta_dashboard_pgdata:

networks:
  caddy_net:
    external: true
